name: docs

# Offline check of the relative Markdown links and of the language selectors.
on:
  push:
    branches: [main, "feat/**"]
    paths: ["**.md", ".github/scripts/check_markdown_links.py", ".github/workflows/docs.yml"]
  pull_request:
    paths: ["**.md", ".github/scripts/check_markdown_links.py", ".github/workflows/docs.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  links:
    name: Markdown links
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
      - run: python .github/scripts/check_markdown_links.py
