name: observatorio-laboral-ec · modelo y API

# Fase 8 (MLOps): reentrena el modelo de informalidad desde los microdatos públicos del INEC, comprueba que no
# empeora, prueba la API y construye la imagen Docker con una prueba de humo. No usa secretos.
on:
  push:
    paths:
      - "observatorio-laboral-ec/src/observatorio/modelo_informalidad.py"
      - "observatorio-laboral-ec/src/observatorio/api.py"
      - "observatorio-laboral-ec/src/observatorio/prediccion.py"
      - "observatorio-laboral-ec/scripts/entrenar_informalidad.py"
      - "observatorio-laboral-ec/api/**"
      - "observatorio-laboral-ec/requirements-ml.txt"
      - "observatorio-laboral-ec/requirements-api.txt"
      - "observatorio-laboral-ec/tests/test_api.py"
      - ".github/workflows/observatorio-laboral-ec-modelo.yml"
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: observatorio-laboral-ec

jobs:
  modelo-api:
    name: entrenar, probar API y construir imagen
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: observatorio-laboral-ec/requirements*.txt
      - run: pip install -r requirements-ml.txt -r requirements-api.txt pytest httpx

      - name: Caché de los microdatos descargados
        uses: actions/cache@v4
        with:
          path: observatorio-laboral-ec/data/raw
          key: enemdu-raw-${{ github.run_id }}
          restore-keys: enemdu-raw-

      - name: Ingesta (idempotente; con caché solo baja los meses nuevos)
        run: python -m observatorio.ingesta --desde 2023-01 --hasta actual

      - name: Entrenar y evaluar
        run: python scripts/entrenar_informalidad.py

      - name: Puerta de calidad (el modelo no puede empeorar)
        run: |
          python - <<'EOF'
          import json, sys
          m = json.load(open("reports/modelo_informalidad/metricas.json", encoding="utf-8"))["prueba"]
          auc, base = m["lightgbm"]["auc_roc"], m["regresion_logistica"]["auc_roc"]
          dif = abs(m["lightgbm"]["tasa_estimada_pct"] - m["lightgbm"]["tasa_observada_pct"])
          print(f"AUC LightGBM {auc:.4f} | logística {base:.4f} | calibración {dif:.2f} pp")
          ok = auc >= 0.88 and auc > base and dif < 1.5
          sys.exit(0 if ok else "El modelo no supera los umbrales: no se publica")
          EOF

      - name: Tests de la API
        run: pytest tests/test_api.py -q

      - name: Construir la imagen Docker
        run: docker build -f api/Dockerfile -t observatorio-api:${{ github.sha }} .

      - name: Prueba de humo del contenedor
        run: |
          docker run -d --name api -p 8000:8000 observatorio-api:${{ github.sha }}
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8000/salud && break; sleep 1; done
          curl -sf -X POST http://127.0.0.1:8000/prediccion -H "Content-Type: application/json" \
            -d '{"edad":28,"sexo":"Mujer","estado_civil":"Soltero(a)","nivel_instruccion":"Educación media/bachillerato","area":"Urbana","provincia":"Guayas","rama":"Comercio","ocupacion":"Trabajadores de servicios y vendedores"}' \
            | tee respuesta.json
          python -c "import json; p=json.load(open('respuesta.json'))['probabilidad_informal']; assert 0<p<1, p; print('probabilidad', p)"
          docker logs api
          docker rm -f api

      - name: Guardar modelo e informe
        uses: actions/upload-artifact@v4
        with:
          name: modelo-informalidad-${{ github.sha }}
          path: |
            observatorio-laboral-ec/models/informalidad_lgbm.joblib
            observatorio-laboral-ec/reports/modelo_informalidad/
          retention-days: 30
