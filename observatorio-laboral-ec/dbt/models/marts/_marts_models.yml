version: 2

models:
  - name: fct_mercado_laboral
    description: >
      Hecho principal del modelo estrella. Grano: mes × sexo × área × provincia × grupo de edad × nivel de
      instrucción. Contiene poblaciones expandidas (sumas del factor de expansión), nunca tasas, para que cualquier
      indicador se pueda recalcular correctamente a cualquier nivel de agregación.
    data_tests:
      - unique:
          arguments:
            column_name: >-
              periodo || '-' || sexo_cod || '-' || area_cod || '-' || provincia_cod || '-' || grupo_edad || '-'
              || coalesce(nivel_instruccion_cod::text, 'na')
    columns:
      - name: periodo
        data_tests:
          - not_null
          - relationships:
              arguments: {to: ref('dim_periodo'), field: periodo}
      - name: provincia_cod
        data_tests:
          - relationships:
              arguments: {to: ref('dim_provincia'), field: provincia_cod}
      - name: pea
        description: Población económicamente activa expandida.

  - name: indicadores_nacionales
    description: Tasas nacionales mensuales del mercado laboral (en %), comparadas con el INEC en un test.
    columns:
      - name: periodo
        data_tests: [unique, not_null]

  - name: dim_periodo
    description: Dimensión de tiempo (un registro por mes con datos).
    columns:
      - name: periodo
        data_tests: [unique, not_null]

  - name: dim_provincia
    description: Provincias del Ecuador y su región natural.
    columns:
      - name: provincia_cod
        data_tests: [unique, not_null]
