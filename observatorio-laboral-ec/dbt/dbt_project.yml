name: observatorio
version: "0.1.0"
config-version: 2
profile: observatorio

model-paths: ["models"]
test-paths: ["tests"]
macro-paths: ["macros"]
seed-paths: ["seeds"]

clean-targets: ["target", "dbt_packages"]

models:
  observatorio:
    staging:
      +materialized: view
      +schema: staging
    intermediate:
      +materialized: view
      +schema: intermediate
    marts:
      +materialized: table
      +schema: marts
