version: 2

sources:
  - name: raw
    description: Microdatos de la ENEMDU cargados por `python -m observatorio.carga` (una fila por persona y mes).
    schema: raw
    tables:
      - name: enemdu_personas
        description: Tabla de personas de los datos abiertos de la ENEMDU (INEC), 18 columnas seleccionadas.
        columns:
          - name: periodo
            data_tests: [not_null]
          - name: id_persona
            data_tests: [not_null]
          - name: fexp
            data_tests: [not_null]
      - name: cargas
        description: Registro de control de la carga (periodo, filas, fecha).
        # El INEC publica la ENEMDU cada mes con unas semanas de retraso: más de 45 días sin cargar nada es raro
        # (aviso) y más de 75 indica que el pipeline o la fuente fallan (error).
        config:
          loaded_at_field: "cargado_utc::timestamptz"
          freshness:
            warn_after: {count: 45, period: day}
            error_after: {count: 75, period: day}
