# PostgreSQL local para desarrollo como alternativa a una instalación nativa (en producción se usa Neon).
services:
  postgres:
    image: postgres:16-alpine
    container_name: observatorio-pg
    environment:
      POSTGRES_DB: ${PGDATABASE:-observatorio}
      POSTGRES_USER: ${PGUSER:-observatorio}
      POSTGRES_PASSWORD: ${PGPASSWORD:?define PGPASSWORD en .env}
    ports:
      - "127.0.0.1:${PGPORT:-5432}:5432"   # solo accesible desde este equipo
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
