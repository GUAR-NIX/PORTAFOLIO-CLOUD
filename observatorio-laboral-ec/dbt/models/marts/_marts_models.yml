version: 2

models:
  - name: fct_mercado_laboral
    description: >
      Hecho principal del modelo estrella. Grano: mes × sexo × área × provincia × grupo de edad × nivel de
      instrucción. Contiene poblaciones expandidas (sumas del factor de expansión), nunca tasas, para que cualquier
      indicador se pueda recalcular correctamente a cualquier nivel de agregación. Los tests de contenido se
      ejecutan antes, sobre `aud_fct_mercado_laboral`.
    columns:
      - name: periodo
        data_tests:
          - not_null
          - relationships:
              arguments: {to: ref('dim_periodo'), field: periodo}
      - name: pea
        description: Población económicamente activa expandida.

  - name: bi_mercado_laboral
    description: >
      Vista para Power BI y Looker Studio: el hecho con etiquetas legibles (sexo, área, provincia, región, nivel de
      instrucción). Contiene poblaciones; las tasas se calculan en la herramienta con medidas (suma / suma).
    data_tests:
      - expression_is_true:
          arguments:
            expression: "sexo <> 'Sin dato' and area <> 'Sin dato' and provincia <> 'Sin dato'"

  - name: indicadores_nacionales
    description: Tasas nacionales mensuales del mercado laboral (en %), comparadas con el INEC en un test.
    columns:
      - name: periodo
        data_tests: [unique, not_null]

  - name: dim_periodo
    description: Dimensión de tiempo (un registro por mes con datos).
    columns:
      - name: periodo
        data_tests: [unique, not_null]

  - name: dim_provincia
    description: Provincias del Ecuador y su región natural.
    columns:
      - name: provincia_cod
        data_tests: [unique, not_null]
