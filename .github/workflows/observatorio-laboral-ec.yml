name: observatorio-laboral-ec

on:
  push:
    paths: ["observatorio-laboral-ec/**", ".github/workflows/observatorio-laboral-ec.yml"]
  pull_request:
    paths: ["observatorio-laboral-ec/**", ".github/workflows/observatorio-laboral-ec.yml"]
defaults:
  run:
    working-directory: observatorio-laboral-ec

permissions:
  contents: read

jobs:
  python:
    name: ruff + pytest
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: observatorio-laboral-ec/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Ruff
        run: ruff check src tests scripts app
      - name: Pytest
        run: pytest -rs

  dbt:
    name: dbt parse (sin base de datos)
    runs-on: ubuntu-latest
    env:
      # Valores ficticios: "dbt parse" valida el proyecto sin conectarse a ninguna base de datos.
      PGHOST: localhost
      PGDATABASE: ci
      PGUSER: ci
      PGPASSWORD: ci-sin-secretos
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: observatorio-laboral-ec/requirements*.txt
      - run: pip install -r requirements.txt
      - name: Validar proyecto dbt
        working-directory: observatorio-laboral-ec/dbt
        run: dbt parse --profiles-dir .

  dbt-incremental:
    name: dbt incremental y publicación auditada (PostgreSQL)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci-sin-secretos
          POSTGRES_DB: prueba
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ci -d prueba" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      # Base desechable del propio job, con datos sintéticos: no se conecta a Neon.
      DBT_PRUEBAS: "1"
      PYTHONPATH: src
      PGHOST: localhost
      PGDATABASE: prueba
      PGUSER: ci
      PGPASSWORD: ci-sin-secretos
      PGSSLMODE: disable
      DBT_TARGET: dev
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: observatorio-laboral-ec/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: 8 escenarios (mes nuevo, revisión, datos malos, tasa que no cuadra, cambio de lógica, migración)
        run: pytest tests/test_dbt_incremental.py -rs
