name: observatorio-laboral-ec · pipeline

# Ingesta → carga en Neon → dbt build → frescura → resumen. Cada lunes y bajo demanda.
# Es idempotente: si el INEC no ha publicado nada nuevo, no carga nada y los tests se vuelven a comprobar.
on:
  schedule:
    - cron: "0 13 * * 1"   # lunes 13:00 UTC (08:00 en Ecuador)
  workflow_dispatch:

concurrency:
  group: observatorio-laboral-ec-pipeline
  cancel-in-progress: false

permissions:
  contents: read

defaults:
  run:
    working-directory: observatorio-laboral-ec

jobs:
  pipeline:
    name: ingesta, carga y dbt
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONPATH: src
      PGHOST: ${{ secrets.NEON_PGHOST }}
      PGDATABASE: ${{ secrets.NEON_PGDATABASE }}
      PGUSER: ${{ secrets.NEON_PGUSER }}
      PGPASSWORD: ${{ secrets.NEON_PGPASSWORD }}
      PGSSLMODE: require
      DBT_TARGET: prod
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: observatorio-laboral-ec/requirements*.txt
      - run: pip install -r requirements.txt

      - name: Comprobar que los secrets existen
        run: |
          for v in PGHOST PGDATABASE PGUSER PGPASSWORD; do
            if [ -z "${!v}" ]; then echo "::error::Falta el secret NEON_$v"; exit 1; fi
          done

      - name: Ingesta (meses publicados hasta hoy)
        run: python -m observatorio.ingesta --desde 2023-01 --hasta actual

      - name: Carga en PostgreSQL (solo meses nuevos)
        run: python -m observatorio.carga --solo-faltantes

      - name: dbt build (seeds, modelos y 40 tests)
        working-directory: observatorio-laboral-ec/dbt
        run: dbt build --profiles-dir .

      - name: Frescura de los datos
        working-directory: observatorio-laboral-ec/dbt
        run: dbt source freshness --profiles-dir .

      - name: Resumen del run
        if: success()
        run: python scripts/resumen_pipeline.py >> "$GITHUB_STEP_SUMMARY"
