[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "observatorio-laboral-ec"
version = "0.1.0"
description = "Mercado laboral de Ecuador: de los microdatos de la ENEMDU a un modelo en producción y un dashboard público."
authors = [{ name = "Erick Guarnizo" }]
license = { text = "MIT" }
requires-python = ">=3.12,<3.13"
readme = "README.md"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
